server.port=${PORT:8085}

# The agents who can sign in (HelpdeskProperties). A real application would use Spring Security and its user store.
helpdesk.agents=Ama,Kofi,Esi,Yaw
# The largest attachment kept, in bytes.
helpdesk.max-attachment-bytes=5242880

# The web target's settings (jasx-web-spring-boot-starter). The upload limit must allow the attachments above.
jasx.web.max-upload-bytes=5242880
